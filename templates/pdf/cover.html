<!-- cover.html -->
<section class="pdf-page cover-page"
  style="--page-bg: {{ identity.branding.color_primary }}; --page-color: {{ identity.branding.color_text }}; --brand-accent: {{ identity.branding.color_accent }};">
  <div class="cover-grid-bg"></div>

  <div class="cover-top-accent"></div>

  <header class="cover-header">
    <div class="cover-brand">
      <img src="static/pdf/icon_torre.svg" alt="Castling" class="cover-brand-icon">
      <span class="cover-brand-name">Castling.me</span>
    </div>
    <div class="cover-header-ribbon"></div>
  </header>

  <section class="cover-photo-wrap">
    <img src="static/pdf/jogoxadrez.jpg" alt="Jogo de xadrez" class="cover-photo-img">
    <div class="cover-photo-overlay"></div>
    <img src="static/pdf/barradecima.svg" alt="Faixa decorativa superior" class="cover-ribbon-top">
  </section>

  <section class="cover-title-zone">
    <div class="cover-market-overlay"></div>
    <img src="static/pdf/barradebaixo.svg" alt="Faixa decorativa inferior" class="cover-ribbon-bottom">
    <div class="cover-main">
      <h1 class="cover-title">{{ identity.title|upper }}</h1>
      <div class="cover-period">
        <span>{{ identity.period_start }}</span>
        <span class="arrow">→</span>
        <span>{{ identity.period_end }}</span>
      </div>
      <div class="cover-period-line"></div>
    </div>
  </section>

  <div class="cover-footer-link footer-link">
    <a href="{{ editorial.link }}">{{ editorial.link }}</a>
  </div>
</section>
